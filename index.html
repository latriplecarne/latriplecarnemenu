<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Triple Carne del Sabor · Menú</title>
<meta name="description" content="Menú de La Triple Carne del Sabor, Valledupar: hamburguesas, chuzos, fritos y gaseosas.">
<meta property="og:title" content="La Triple Carne del Sabor · Menú">
<meta property="og:image" content="assets/logo.png">
<link rel="icon" href="assets/logo.png">
<style>
:root{--bg:#000;--panel:#121212;--line:#2a2a2a;--text:#f2ede4;--muted:#a39d92;--gold:#e0a21b}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{text-align:center;padding:0 0 8px}
header img{width:min(100%,520px);display:block;margin:0 auto}
header p{color:var(--muted);font-size:.95rem;padding:0 20px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:var(--text);text-decoration:none;padding:8px 16px;border:1px solid var(--line);border-radius:999px;font-weight:700;font-size:.92rem}
nav a:hover,nav a:focus-visible{background:var(--gold);color:#000;border-color:var(--gold);outline:none}
main{max-width:720px;margin:0 auto;padding:8px 16px 40px}
section{padding-top:36px}
h2{font:800 1.9rem/1.1 Georgia,"Times New Roman",serif;color:var(--gold);padding-bottom:6px}
.sub{color:var(--muted);font-size:.92rem;margin-bottom:14px}
.item{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.thumb{flex:none;width:120px;height:80px;background:var(--panel);border-radius:10px;display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain}.thumb img.foto{object-fit:cover}
.thumb svg{width:64px;height:64px}
.info{flex:1;min-width:0}
.info h3{font-size:1.05rem;font-weight:700}
.info p{color:var(--muted);font-size:.88rem;line-height:1.35}
.price{flex:none;font-weight:800;color:var(--gold);font-size:1.05rem;white-space:nowrap}
.star{border:1px solid var(--gold);border-radius:12px;margin-top:6px;padding:14px;background:var(--panel)}
.star .thumb{width:112px;height:112px;background:none}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:28px 20px 40px;border-top:1px solid var(--line)}
@media(max-width:380px){.thumb{width:96px;height:64px}.thumb svg{width:52px;height:52px}.star .thumb{width:92px;height:92px}}
</style>
</head>
<body>
<header>
<img src="assets/logo.png" alt="La Triple Carne del Sabor">
<p>La Triple Carne del Sabor</p>
</header>
<nav aria-label="Categorías">
<a href="#hamburguesas">Hamburguesas</a><a href="#chuzos">Chuzos</a><a href="#fritos">Fritos</a><a href="#personales">Gaseosas personales</a><a href="#litro">Gaseosas de litro</a>
</nav>
<main id="menu"></main>
<footer>La Triple Carne del Sabor</footer>
<script>
const C={bun:"#c8801e",patty:"#5a3a2a",cheese:"#e0a21b",green:"#5b8c3a",red:"#b8402f",wood:"#8a5a2b",paper:"#e8dfcf",pot:"#d9a441"};
const I={
burger:`<svg viewBox="0 0 64 64"><path d="M8 26a24 18 0 0 1 48 0z" fill="${C.bun}"/><rect x="6" y="28" width="52" height="5" rx="2.5" fill="${C.green}"/><rect x="8" y="33" width="48" height="5" fill="${C.cheese}"/><rect x="6" y="38" width="52" height="8" rx="4" fill="${C.patty}"/><path d="M8 48h48v2a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6z" fill="${C.bun}"/></svg>`,
chicken:`<svg viewBox="0 0 64 64"><path d="M8 26a24 18 0 0 1 48 0z" fill="${C.bun}"/><rect x="6" y="28" width="52" height="5" rx="2.5" fill="${C.green}"/><rect x="6" y="33" width="52" height="13" rx="6" fill="#d89a3c"/><path d="M8 48h48v2a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6z" fill="${C.bun}"/></svg>`,
chuzo:`<svg viewBox="0 0 64 64"><rect x="4" y="30" width="56" height="4" rx="2" fill="${C.wood}"/><rect x="12" y="20" width="12" height="24" rx="5" fill="${C.patty}"/><rect x="26" y="20" width="12" height="24" rx="5" fill="#9b5a35"/><rect x="40" y="20" width="12" height="24" rx="5" fill="${C.patty}"/></svg>`,
fries:`<svg viewBox="0 0 64 64"><g fill="${C.pot}"><rect x="16" y="10" width="7" height="30" rx="2"/><rect x="25" y="6" width="7" height="34" rx="2"/><rect x="34" y="10" width="7" height="30" rx="2"/><rect x="43" y="14" width="7" height="26" rx="2"/></g><path d="M12 36h40l-4 22H16z" fill="${C.red}"/></svg>`,
rings:`<svg viewBox="0 0 64 64"><g fill="none" stroke="${C.pot}" stroke-width="7"><circle cx="24" cy="26" r="12"/><circle cx="42" cy="38" r="12"/></g></svg>`,
wings:`<svg viewBox="0 0 64 64"><path d="M14 40c0-14 10-24 24-24 8 0 12 6 12 12 0 12-12 22-26 22-6 0-10-4-10-10z" fill="#b5651d"/><rect x="44" y="30" width="14" height="6" rx="3" fill="${C.paper}"/></svg>`,
can:c=>`<svg viewBox="0 0 64 64"><rect x="20" y="8" width="24" height="48" rx="5" fill="${c}"/><rect x="20" y="8" width="24" height="6" rx="3" fill="#cfcfcf"/><rect x="20" y="26" width="24" height="12" fill="${C.paper}" opacity=".9"/></svg>`,
bottle:c=>`<svg viewBox="0 0 64 64"><rect x="27" y="4" width="10" height="8" rx="2" fill="#cfcfcf"/><path d="M28 12h8v8l8 8v26a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4V28l8-8z" fill="${c}"/><rect x="20" y="34" width="24" height="12" fill="${C.paper}" opacity=".9"/></svg>`,
water:`<svg viewBox="0 0 64 64"><rect x="27" y="4" width="10" height="8" rx="2" fill="#cfcfcf"/><path d="M28 12h8v8l8 8v26a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4V28l8-8z" fill="#7fb4d6"/></svg>`};
const cola="#a32018",ora="#d9791c",man="#4f8f3a",uva="#5b3a8a",pep="#1f4e9a";
const M=[
{id:"hamburguesas",t:"Hamburguesas",s:"Pan brioche, papas aparte. Adiciona queso o tocineta por $3.000.",i:[
{n:"La Triple Carne del Sabor",d:"Tres carnes a la parrilla, queso cheddar y suizo, tocineta, cebolla caramelizada, tomate, lechuga, rúcula y salsa de la casa.",p:32000,img:"assets/hamburguesa.png",star:1},
{n:"Doble Carne",d:"Dos carnes, queso cheddar, tomate, lechuga y salsa de la casa.",p:24000,img:"assets/doble-carne.jpg",foto:1},
{n:"Sencilla",d:"Carne, queso, tomate, lechuga y salsa de la casa.",p:17000,img:"assets/sencilla.jpg",foto:1},
{n:"Pollo Crispy",d:"Pechuga apanada, lechuga, tomate y salsa ranch.",p:21000,img:"assets/pollo-crispy.jpg",foto:1},
{n:"Hamburguesa con Tocineta",d:"Carne, tocineta crocante, queso cheddar y cebolla caramelizada.",p:23000,img:"assets/tocineta.jpg",foto:1}]},
{id:"chuzos",t:"Chuzos",s:"Con papa criolla, arepa y hogao.",i:[
{n:"Chuzo de Pollo",d:"Pollo marinado a la parrilla.",p:15000,img:"assets/chuzo-pollo.jpg",foto:1},
{n:"Chuzo de Cerdo",d:"Cerdo adobado a la brasa.",p:16000,img:"assets/chuzo-cerdo.jpg",foto:1},
{n:"Chuzo de Res",d:"Lomo de res a la parrilla.",p:18000,img:"assets/chuzo-res.jpg",foto:1},
{n:"Chuzo Desgranado",d:"Pollo, res, tocineta, maíz tierno y queso gratinado.",p:24000,img:"assets/chuzo-desgranado.jpg",foto:1}]},
{id:"fritos",t:"Fritos",s:"Para compartir o acompañar.",i:[
{n:"Papas a la Francesa",d:"Porción grande con salsas.",p:9000,img:"assets/papas-francesa.jpg",foto:1},
{n:"Papas Trifásicas",d:"Papas con queso fundido, tocineta y salsa de la casa.",p:15000,img:"assets/papas-trifasicas.jpg",foto:1},
{n:"Aros de Cebolla",d:"Apanados y crocantes.",p:10000,img:"assets/aros-cebolla.jpg",foto:1},
{n:"Alitas x6",d:"Fritas, con salsa BBQ o miel mostaza.",p:19000,img:"assets/alitas.jpg",foto:1}]},
{id:"personales",t:"Gaseosas personales",s:"Botella de 400 ml.",i:[
{n:"Coca-Cola",p:4500,ic:"bottle",c:cola},{n:"Postobón Manzana",p:4000,ic:"bottle",c:man},{n:"Colombiana",p:4000,ic:"bottle",c:ora},{n:"Pepsi",p:4000,ic:"bottle",c:pep},{n:"Uva Postobón",p:4000,ic:"bottle",c:uva},{n:"Agua",p:3000,ic:"water"}]},
{id:"litro",t:"Gaseosas de litro",s:"Para la mesa. Botella de 1,5 L.",i:[
{n:"Coca-Cola 1,5 L",p:9500,ic:"bottle",c:cola},{n:"Postobón Manzana 1,5 L",p:8000,ic:"bottle",c:man},{n:"Colombiana 1,5 L",p:8000,ic:"bottle",c:ora},{n:"Pepsi 1,5 L",p:7500,ic:"bottle",c:pep}]}];
const f=n=>"$"+n.toLocaleString("es-CO");
const th=x=>x.img?`<img class="${x.foto?"foto":""}" src="${x.img}" alt="${x.n}" loading="lazy">`:(typeof I[x.ic]==="function"?I[x.ic](x.c):I[x.ic]);
document.getElementById("menu").innerHTML=M.map(c=>`<section id="${c.id}"><h2>${c.t}</h2><p class="sub">${c.s}</p>${c.i.map(x=>`<div class="item${x.star?" star":""}"><div class="thumb">${th(x)}</div><div class="info"><h3>${x.n}</h3>${x.d?`<p>${x.d}</p>`:""}</div><div class="price">${f(x.p)}</div></div>`).join("")}</section>`).join("");
</script>
</body>
</html>
